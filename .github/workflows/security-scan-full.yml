# Copy this into a calling repo as .github/workflows/security-scan-full.yml.
# Runs a periodic full-history sweep: catches anything that slipped in
# before this pipeline existed, or before a repo was ever audited. Does not
# block anything - it's a scheduled report, not a required check.
name: security-scan-full-history

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch: {} # allow a manual run from the Actions tab too

permissions:
  contents: read

jobs:
  scan:
    uses: jotavare/security-pipeline/.github/workflows/scan.yml@main
    with:
      canonical-email: 38820667+jotavare@users.noreply.github.com
      full-history: true
    secrets:
      personal-email-pattern: ${{ secrets.PERSONAL_EMAIL_PATTERN }}
      personal-data-pattern: ${{ secrets.PERSONAL_DATA_PATTERN }} # optional
      ai-trailer-pattern: ${{ secrets.AI_TRAILER_PATTERN }} # optional, has a built-in default
